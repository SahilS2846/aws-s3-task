name: AWS Infrastructure Automation

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  # ==========================================
  # STAGE 1 - CREATE S3 BUCKETS
  # ==========================================

  create-buckets:

    name: Stage 1 - Create S3 Buckets

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install boto3
        run: pip install boto3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws_iam_role }}
          aws-region: ap-south-1

      - name: Create S3 buckets
        run: python scripts/create_s3_buckets.py


  # ==========================================
  # STAGE 2 - CREATE IAM ROLES
  # ==========================================

  create-roles:

    name: Stage 2 - Create IAM Roles

    needs: create-buckets

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install boto3
        run: pip install boto3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws_iam_role }}
          aws-region: ap-south-1

      - name: Create IAM roles
        run: python scripts/setup_iam_roles.py


  # ==========================================
  # STAGE 3 - CREATE IAM USERS
  # ==========================================

  create-users:

    name: Stage 3 - Create IAM Users

    needs: create-roles

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install boto3
        run: pip install boto3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws_iam_role }}
          aws-region: ap-south-1

      - name: Create IAM users
        run: python scripts/setup_iam_users.py


  # ==========================================
  # STAGE 4 - VALIDATION
  # ==========================================

  validation:

    name: Stage 4 - Validate Resources

    needs:
      - create-buckets
      - create-roles
      - create-users

    runs-on: ubuntu-latest

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws_iam_role }}
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify Bucket X
        run: aws s3api head-bucket --bucket my-bucket-x-123

      - name: Verify Bucket Y
        run: aws s3api head-bucket --bucket my-bucket-y-123

      - name: Verify Bucket Z
        run: aws s3api head-bucket --bucket my-bucket-z-123

      - name: Verify Role A
        run: aws iam get-role --role-name S3-Role-A

      - name: Verify Role B
        run: aws iam get-role --role-name S3-Role-B

      - name: Verify Role C
        run: aws iam get-role --role-name S3-Role-C

      - name: Verify User A
        run: aws iam get-user --user-name User-A

      - name: Verify User B
        run: aws iam get-user --user-name User-B

      - name: Verify User C
        run: aws iam get-user --user-name User-C